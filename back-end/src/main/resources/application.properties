spring.application.name=src

# Porta: o Render define a variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco Oracle: os valores vem de variaveis de ambiente (nao coloque a senha aqui!)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Enderecos do front-end que podem chamar a API (separados por virgula)
app.cors.origins=${FRONTEND_URL:http://localhost:5173}
